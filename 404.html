<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>

    <script>
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem(
        "redirect",
        path + search + hash
      );

      window.location.replace("/PORTFOLIO/");
    </script>
  </head>

  <body>
    Redirecting...
  </body>
</html>
